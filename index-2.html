<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blaze Admin</title>
<style>
:root{--bg:#fbf7f3;--sf:#fff;--tx:#1e1613;--mu:#7a6a62;--bd:#eadfd7;--ac:#e8431a;--ac2:#ff8a3d;--ok:#1f9d55;--er:#c62828;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#17110e;--sf:#221916;--tx:#f6ece6;--mu:#a8958b;--bd:#3a2c26;--ac:#ff6a3d;--ac2:#ffa24d;--ok:#45c27b;--er:#ff7b72;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 84px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--bd);padding:12px 16px;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;color:#fff;font-weight:800}
h1{font-size:19px;margin:0;font-weight:800;flex:1}
main{max-width:720px;margin:0 auto;padding:16px}
h2{font-size:16px;margin:20px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px}
.stat b{display:block;font-size:26px;font-weight:800;line-height:1.1}
.stat span,.mu{color:var(--mu);font-size:13px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.bar{height:8px;border-radius:8px;background:var(--bd);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2))}
input,select,button{font:inherit;color:var(--tx)}
input,select{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.btn{border:0;background:var(--ac);color:#fff;padding:10px 14px;border-radius:10px;font-weight:700;cursor:pointer}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--bd);font-weight:600;padding:6px 10px;font-size:13px}
.btn.d{color:var(--er)}
.plan{display:flex;flex-direction:column;gap:10px}.plan .days{font-size:20px;font-weight:800}
.price{display:flex;align-items:center;gap:6px}.price input{width:90px}
.sw{position:relative;width:44px;height:26px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;width:100%;height:100%;cursor:pointer}
.sw s{position:absolute;inset:0;border-radius:26px;background:var(--bd);transition:.2s;pointer-events:none}
.sw s::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+s{background:var(--ok)}.sw input:checked+s::after{left:21px}
.tag{font-size:12px;padding:2px 8px;border-radius:20px;font-weight:700}
.tag.a{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.tag.e{background:color-mix(in srgb,var(--er) 16%,transparent);color:var(--er)}
.form{display:grid;gap:8px;margin-bottom:12px}.u{display:flex;flex-direction:column;gap:8px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.empty{text-align:center;color:var(--mu);padding:28px 10px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--bd);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
nav button{flex:1;border:0;background:none;padding:8px 4px;border-radius:10px;color:var(--mu);font-weight:600;cursor:pointer;font-size:13px}
nav button[aria-current="true"]{color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent)}
.login{max-width:360px;margin:12vh auto 0;padding:16px}
.err{color:var(--er);font-size:13px;min-height:20px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:14px;z-index:20}
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,onSnapshot,setDoc,addDoc,updateDoc,deleteDoc,writeBatch} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyBakrzTAHjSRAaL-xMMDNUTlQdT3bhPXS4",
  authDomain:"blaze-admin-97b01.firebaseapp.com",
  projectId:"blaze-admin-97b01",
  storageBucket:"blaze-admin-97b01.firebasestorage.app",
  messagingSenderId:"384577119626",
  appId:"1:384577119626:web:d638a38ea34b26c3f35473"
});
const auth=getAuth(app),db=getFirestore(app),DAY=864e5,$=document.getElementById("root");
let P=[],U=[],K=[],tab="home",unsubs=[],tm;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const left=u=>Math.ceil((u.exp-Date.now())/DAY),money=n=>"₹"+n;
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);clearTimeout(tm);tm=setTimeout(()=>t.remove(),1800)}
const run=(p,ok)=>p.then(()=>ok&&toast(ok)).catch(e=>toast("Error: "+(e.code||e.message)));

function loginView(msg){
  $.innerHTML=`<div class="login card"><div class="row" style="justify-content:flex-start"><div class="logo">B</div><h1>Blaze Admin</h1></div>
  <div class="form" style="margin-top:16px"><input id="em" type="email" placeholder="Email" autocomplete="username"><input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <div class="err" id="er">${msg||""}</div><button class="btn" id="go">Log in</button></div></div>`;
  const go=()=>signInWithEmailAndPassword(auth,em.value.trim(),pw.value).catch(()=>{er.textContent="Wrong email or password"});
  document.getElementById("go").onclick=go;pw.onkeydown=e=>{if(e.key==="Enter")go()};
}

function home(){
  const act=U.filter(u=>left(u)>0).length,rev=U.reduce((a,u)=>a+(u.paid||0),0);
  const mx=Math.max(1,...P.map(p=>U.filter(u=>u.days==p.days).length));
  return `<div class="grid"><div class="card stat"><b>${U.length}</b><span>Total users</span></div><div class="card stat"><b>${act}</b><span>Active</span></div>
  <div class="card stat"><b>${U.length-act}</b><span>Expired</span></div><div class="card stat"><b>${money(rev)}</b><span>Total revenue</span></div></div>
  <h2>Users by plan</h2><div class="card">${P.map(p=>{const c=U.filter(u=>u.days==p.days).length;
  return `<div style="margin-bottom:10px"><div class="row"><span>${p.days} Day</span><span class="mu">${c} users</span></div><div class="bar"><i style="width:${c/mx*100}%"></i></div></div>`}).join("")}</div>`}

function plans(){
  return `<h2>Plans</h2><div class="grid">${P.map(p=>`<div class="card plan"><div class="row"><span class="days">${p.days} Day</span>
  <label class="sw"><input type="checkbox" data-t="${p.days}" ${p.active?"checked":""} aria-label="${p.days} Day on/off"><s></s></label></div>
  <div class="price"><span class="mu">₹</span><input type="number" min="0" value="${p.price}" data-p="${p.days}" aria-label="${p.days} Day price"></div>
  <span class="mu">${p.active?"Active":"Off"}</span></div>`).join("")}</div>`}

function users(){
  const opts=P.filter(p=>p.active).map(p=>`<option value="${p.days}">${p.days} Day — ${money(p.price)}</option>`).join("");
  let h=`<h2>Users</h2><div class="card form"><input id="nm" placeholder="User name or ID" maxlength="40"><select id="pl">${opts}</select><button class="btn" id="add">Add user</button></div>`;
  if(!U.length)return h+`<div class="empty">No users yet. Enter a name above and pick a plan.</div>`;
  return h+`<div class="u">${U.map(u=>{const l=left(u);return `<div class="card"><div class="row"><b>${esc(u.name)}</b><span class="tag ${l>0?"a":"e"}">${l>0?l+" days left":"Expired"}</span></div>
  <div class="mu">${u.days} Day plan · ${money(u.paid||0)}</div><div class="acts">
  ${[1,7,30].map(d=>`<button class="btn g" data-x="${u.id}" data-d="${d}">+${d} Day</button>`).join("")}
  <button class="btn g d" data-r="${u.id}">Delete</button></div></div>`}).join("")}</div>`}

const CH="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
function mk(){const a=new Uint8Array(12);crypto.getRandomValues(a);const s=[...a].map(n=>CH[n%CH.length]).join("");return "BLAZE-"+s.slice(0,4)+"-"+s.slice(4,8)+"-"+s.slice(8)}
function keysV(){
  const un=K.filter(k=>k.status!=="used").length;
  const opts=P.map(p=>`<option value="${p.days}">${p.days} Day</option>`).join("");
  let h=`<h2>Key generator</h2><div class="card form"><select id="kp" aria-label="Plan">${opts}</select><span class="mu">How many keys (1–100)</span><input id="kq" type="number" min="1" max="100" value="1" aria-label="How many keys"><span class="mu">Max devices per key (1–1000)</span><input id="kd" type="number" min="1" max="1000" value="1" aria-label="Max devices per key"><button class="btn" id="gen">Generate keys</button><span class="mu">No balance or limit. Up to 100 keys per batch.</span></div>
  <div class="row" style="margin-bottom:10px"><span class="mu">Total ${K.length} · Unused ${un}</span><button class="btn g" id="cpall">Copy all unused</button></div>`;
  if(!K.length)return h+`<div class="empty">No keys yet. Pick a plan above and generate keys.</div>`;
  return h+`<div class="u">${K.slice(0,200).map(k=>`<div class="card"><div class="row"><b style="font-family:ui-monospace,monospace;font-size:14px">${esc(k.key)}</b><span class="tag ${k.status==="used"?"e":"a"}">${k.status==="used"?"Used":"Unused"}</span></div>
  <div class="mu">${k.days} Day · Devices ${(k.devices||[]).length}/${k.maxDevices||1}</div><div class="acts"><button class="btn g" data-kc="${esc(k.key)}">Copy</button>
  ${k.status==="used"?"":`<button class="btn g" data-ku="${k.id}">Mark used</button>`}<button class="btn g" data-ke="${k.id}">Edit limit</button><button class="btn g" data-kr="${k.id}">Reset devices</button><button class="btn g d" data-kd="${k.id}">Delete</button></div></div>`).join("")}</div>`}

function render(){
  const f=document.activeElement;if(f&&f.matches("[data-p]"))return;
  const keep=["nm","kq","kp","kd"].map(i=>document.getElementById(i)?.value);
  $.innerHTML=`<header><div class="logo">B</div><h1>Blaze Admin</h1><button class="btn g" id="out">Log out</button></header>
  <main>${tab==="home"?home():tab==="plans"?plans():tab==="keys"?keysV():users()}</main>
  <nav>${[["home","Dashboard"],["plans","Plans"],["keys","Keys"],["users","Users"]].map(t=>`<button data-n="${t[0]}" ${tab===t[0]?'aria-current="true"':""}>${t[1]}</button>`).join("")}</nav>`;
  ["nm","kq","kp","kd"].forEach((i,n)=>{const e=document.getElementById(i);if(e&&keep[n])e.value=keep[n]});
}

function start(){
  unsubs.push(onSnapshot(collection(db,"plans"),s=>{
    if(s.empty&&!s.metadata.fromCache){[1,3,7,10,15,30].forEach((d,i)=>setDoc(doc(db,"plans","d"+d),{days:d,price:[20,50,100,140,200,350][i],active:true}));return}
    P=s.docs.map(d=>d.data()).sort((a,b)=>a.days-b.days);render()},e=>loginView("No permission: "+e.code)));
  unsubs.push(onSnapshot(collection(db,"users"),s=>{
    U=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.c||0)-(a.c||0));render()}));
  unsubs.push(onSnapshot(collection(db,"keys"),s=>{K=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.c||0)-(a.c||0));render()}));
}

document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
  if(b.id==="out")signOut(auth);
  else if(d.n){tab=d.n;render();scrollTo(0,0)}
  else if(b.id==="add"){const n=document.getElementById("nm").value.trim(),days=+document.getElementById("pl").value;
    if(!n)return toast("Enter a name");const p=P.find(x=>x.days===days);if(!p)return toast("No active plan");
    run(addDoc(collection(db,"users"),{name:n,days,paid:p.price,exp:Date.now()+days*DAY,c:Date.now()}),"User added");document.getElementById("nm").value=""}
  else if(b.id==="gen"){const days=+document.getElementById("kp").value,q=Math.min(100,Math.max(1,+document.getElementById("kq").value||1)),md=Math.min(1000,Math.max(1,Math.floor(+document.getElementById("kd").value)||1));
    if(!days)return toast("Select a plan");const bt=writeBatch(db);
    for(let i=0;i<q;i++)bt.set(doc(collection(db,"keys")),{key:mk(),days,maxDevices:md,devices:[],status:"unused",c:Date.now()});
    run(bt.commit(),q+" keys created")}
  else if(b.id==="cpall"){const t=K.filter(k=>k.status!=="used").map(k=>k.key).join("\n");if(!t)return toast("No unused keys");navigator.clipboard.writeText(t).then(()=>toast("All copied"),()=>toast("Copy failed"))}
  else if(d.kc)navigator.clipboard.writeText(d.kc).then(()=>toast("Copied"),()=>toast("Copy failed"));
  else if(d.ku)run(updateDoc(doc(db,"keys",d.ku),{status:"used",usedAt:Date.now()}),"Marked as used");
  else if(d.ke){const k=K.find(x=>x.id===d.ke),v=prompt("Max devices for this key (1-1000)",k.maxDevices||1);if(v===null)return;const n=Math.floor(+v);if(!(n>=1&&n<=1000))return toast("Enter a number from 1 to 1000");run(updateDoc(doc(db,"keys",d.ke),{maxDevices:n}),"Limit updated")}
  else if(d.kr){if(confirm("Reset all devices for this key?"))run(updateDoc(doc(db,"keys",d.kr),{devices:[]}),"Devices reset")}
  else if(d.kd){if(confirm("Delete this key?"))run(deleteDoc(doc(db,"keys",d.kd)),"Key deleted")}
  else if(d.x){const u=U.find(x=>x.id===d.x);run(updateDoc(doc(db,"users",d.x),{exp:Math.max(u.exp,Date.now())+d.d*DAY}),"+"+d.d+" Day added")}
  else if(d.r&&confirm("Delete this user?"))run(deleteDoc(doc(db,"users",d.r)),"Deleted")});
document.addEventListener("change",e=>{const t=e.target;
  if(t.dataset.t)run(updateDoc(doc(db,"plans","d"+t.dataset.t),{active:t.checked}));
  else if(t.dataset.p){run(updateDoc(doc(db,"plans","d"+t.dataset.p),{price:Math.max(0,+t.value||0)}),"Price saved");t.blur();render()}});

onAuthStateChanged(auth,u=>{unsubs.forEach(f=>f());unsubs=[];u?start():loginView()});
</script>
</body>
</html>
